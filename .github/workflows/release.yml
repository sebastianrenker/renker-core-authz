name: Release

on:
  push:
    tags:
      - "v*"

permissions:
  contents: read

concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: false

jobs:
  release:
    runs-on: ubuntu-latest
    permissions:
      contents: write
      id-token: write
      attestations: write
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5
        with:
          python-version: "3.12"

      - name: Verify version matches tag
        run: |
          python - <<'PY'
          import os, tomllib
          tag = os.environ["GITHUB_REF_NAME"].lstrip("v")
          version = tomllib.load(open("pyproject.toml", "rb"))["project"]["version"]
          assert tag == version, f"tag {tag} != pyproject version {version}"
          print("version OK:", version)
          PY

      - name: Full quality gate
        run: |
          python -m pip install --upgrade pip build
          python -m pip install -e ".[dev]"
          ruff format --check .
          ruff check .
          mypy
          pytest -q

      - name: Build sdist and wheel
        run: python -m build

      - name: Generate SHA256SUMS
        run: |
          cd dist
          sha256sum * > SHA256SUMS.txt
          cat SHA256SUMS.txt

      - name: Attest build provenance (SLSA)
        uses: actions/attest-build-provenance@ef244123eb79f2f7a7e75d99086184180e6d0018 # v1
        with:
          subject-path: "dist/*.whl, dist/*.tar.gz"

      - name: Publish GitHub Release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release create "${GITHUB_REF_NAME}" dist/* \
            --title "renker-core-authz ${GITHUB_REF_NAME}" \
            --notes "Automated release. Verify artifacts with SHA256SUMS.txt and the attached SLSA build-provenance attestation (\`gh attestation verify\`)."
